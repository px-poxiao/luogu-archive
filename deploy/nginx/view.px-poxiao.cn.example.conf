# Umami 统计后台反代模板。
# 由服务器管理员将本文件纳入实际 Nginx 配置；证书路径按新服务器实际证书调整。

server {
    listen 80;
    listen [::]:80;
    server_name view.px-poxiao.cn;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name view.px-poxiao.cn;

    ssl_certificate /etc/letsencrypt/live/view.px-poxiao.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/view.px-poxiao.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
